name: Patch recovery for fastbootd

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Your Model Number'
        required: true

      recovery_link:
        description: 'Enter the Direct Download Link (.img / .lz4 / .zip / .tar):'
        required: true

      filename:
        description: 'Output filename without extension (default: recovery)'
        required: false
        default: 'recovery'

jobs:
  patch-recovery-revived:
    runs-on: ubuntu-latest
    permissions:
      contents: write    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Running patch-recovery-revived
        run: |
          FILENAME="${{ github.event.inputs.filename }}"
          export FILENAME="${FILENAME:-recovery}"
          GOFILE=1 bash patch-recovery.sh "${{ github.event.inputs.recovery_link }}" "${{ github.event.inputs.model }}"
      
      - name: Uploading Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Fastbootd-patched-recovery-${{ github.event.inputs.model }}"
          path: output/*.tar
